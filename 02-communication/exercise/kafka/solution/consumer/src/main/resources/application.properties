spring.application.name=book-consumer
server.port=8081

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=book-consumer
# Start from the beginning of the topic if this consumer group has no committed offset yet
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# The publisher sends no type headers, so tell the deserializer which class to create
spring.kafka.consumer.properties.spring.json.value.default.type=de.qaware.edu.cc.bookconsumer.BookEvent
