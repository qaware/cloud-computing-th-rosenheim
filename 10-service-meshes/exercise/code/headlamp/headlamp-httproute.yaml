# Routes all requests that reach the Traefik gateway (http://localhost:9999) to the Headlamp service.
# This is the Gateway API successor of the old Ingress resource.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: headlamp
  name: headlamp
spec:
  parentRefs:
    # The Gateway created by the Traefik Helm chart
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
